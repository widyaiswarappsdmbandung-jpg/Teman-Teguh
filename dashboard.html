<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teman Teguh - Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#0a2a7a;min-height:100vh;background:linear-gradient(160deg,#d9f2ff,#a9e4ff 60%,#8bd3ff)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 22px;background:#fff;box-shadow:0 6px 24px rgba(20,70,170,.18);position:sticky;top:0}
.brand{display:flex;align-items:center;gap:10px;font:800 1.2rem 'Baloo 2',sans-serif}
.brand img{height:42px;border-radius:10px}
.me{display:flex;align-items:center;gap:10px;font-weight:800;flex-wrap:wrap;justify-content:flex-end}
.me em{font-style:normal;background:linear-gradient(135deg,#fff0a8,#ffc928);color:#5a3500;border-radius:99px;padding:3px 12px;font-size:.85rem}
button{border:0;border-radius:12px;padding:9px 16px;font:800 .95rem 'Nunito',sans-serif;color:#fff;background:linear-gradient(135deg,#ff5d6c,#ff8a3d);cursor:pointer}
main{max-width:1100px;margin:0 auto;padding:26px 18px 50px}
h1{font:800 clamp(1.6rem,4vw,2.4rem) 'Baloo 2',sans-serif;margin:0 0 16px}
h2{font:800 1.4rem 'Baloo 2',sans-serif;margin:26px 0 12px}
.stats,.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.card{background:#fff;border-radius:22px;padding:18px;box-shadow:0 12px 30px rgba(20,70,170,.18);border-top:6px solid var(--c,#3b82f6)}
.card b{display:block;font:800 2rem 'Baloo 2',sans-serif;color:var(--c,#3b82f6)}
.card h3{margin:0 0 4px;font:800 1.15rem 'Baloo 2',sans-serif}
.card p{margin:2px 0;font-size:.92rem;color:#3d4f86}
#info{font-weight:800;color:#a65f00}
.nv{display:flex;gap:6px;flex-wrap:wrap}.nv a{text-decoration:none;color:#0a2a7a;font-weight:800;font-size:.9rem;padding:7px 14px;border-radius:99px;background:#eaf3ff}.nv a:hover{background:#ffe9a8}
</style>
</head>
<body>
<header class="bar">
  <div class="brand"><img src="logo-teman-teguh.jpg" alt="Teman Teguh"><span>Teman Teguh</span></div>
  <nav class="nv"><a href="index.html">Beranda</a><a href="pustaka.html">Pustaka TEGUH</a><a href="pelatihan.html">Pelatihan</a><a href="profil.html">Profil</a></nav>
  <div class="me"><span id="nama"></span><em id="peran"></em><button id="keluar" type="button">Keluar</button></div>
</header>
<main>
  <h1 id="sapa">Annyeong Haseyo</h1>
  <section class="stats" id="stats"></section>
  <h2>Kelas</h2>
  <div class="grid" id="kelas"></div>
  <p id="info"></p>
</main>
<script>
var API_URL = sessionStorage.getItem('tt_api'), TOKEN = sessionStorage.getItem('tt_token');
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
async function api(a, d) {
  var r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
    body: JSON.stringify({ action: a, token: TOKEN, data: d || {} }) });
  return JSON.parse(await r.text());
}
function keluarLokal() { sessionStorage.clear(); location.replace('index.html'); }
function stat(label, nilai, warna) {
  var c = el('div', 'card'); c.style.setProperty('--c', warna);
  c.appendChild(el('b', '', nilai)); c.appendChild(el('p', '', label)); $('stats').appendChild(c);
}
(async function () {
  if (!TOKEN || !API_URL) return keluarLokal();
  try {
    var s = await api('cekSesi');
    if (!s.success || s.data.wajibGantiPassword) return keluarLokal();
    var u = s.data.user;
    $('nama').textContent = u.Nama; $('peran').textContent = u.Peran;
    $('sapa').textContent = 'Annyeong Haseyo, ' + u.Nama;

    var k = await api('listKelas'), items = (k.success ? k.data.items : []);
    var warna = ['#ff5d6c', '#ffb020', '#18c08a', '#8b5cf6', '#3b82f6'];
    items.forEach(function (x, i) {
      var c = el('div', 'card'); c.style.setProperty('--c', warna[i % warna.length]);
      c.appendChild(el('h3', '', x.Nama_Kelas));
      c.appendChild(el('p', '', x.Nama_Pelatihan + ' - Angkatan ' + x.Angkatan));
      c.appendChild(el('p', '', 'Pengajar: ' + x.Nama_Pengajar));
      c.appendChild(el('p', '', x.JumlahPeserta + ' / ' + x.Kuota + ' peserta'));
      $('kelas').appendChild(c);
    });
    if (!items.length) $('info').textContent = 'Belum ada kelas.';

    if (u.Peran === 'Admin') {
      var a = await api('listUsers', { perHalaman: 1 }), b = await api('listUsers', { peran: 'Peserta', perHalaman: 1 });
      stat('Total pengguna', String(a.success ? a.data.total : '-'), '#3b82f6');
      stat('Total peserta', String(b.success ? b.data.total : '-'), '#18c08a');
    }
    stat('Jumlah kelas', String(items.length), '#ffb020');
  } catch (e) { $('info').textContent = 'Gagal memuat data. Muat ulang halaman.'; }
})();
$('keluar').onclick = async function () { try { await api('logout'); } catch (_) {} keluarLokal(); };
</script>
</body>
</html>
