<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teman Teguh - Pelatihan</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#0a2a7a;min-height:100vh;background:radial-gradient(900px 600px at 85% 8%,#e9f8ff,transparent 60%),linear-gradient(160deg,#a9e4ff,#6cc6ff 55%,#4aa8ff);background-attachment:fixed;overflow-x:hidden}
.bub{position:fixed;z-index:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 26%,#fffbe3 0,#ffe98a 13%,#ffc928 40%,#e29c00 72%,#9c6300 100%);box-shadow:inset -8px -12px 22px rgba(120,70,0,.5),inset 6px 8px 14px rgba(255,255,255,.6),0 18px 28px rgba(20,70,160,.25);animation:fl var(--d,12s) ease-in-out infinite alternate}
.b1{width:120px;height:120px;left:-30px;top:35%;--d:13s}.b2{width:70px;height:70px;right:5%;top:9%;--d:9s}.b3{width:160px;height:160px;right:-50px;bottom:6%;--d:15s}.b4{width:54px;height:54px;left:12%;bottom:8%;--d:8s}
@keyframes fl{to{transform:translateY(-40px)}}
.top{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.back{display:flex;align-items:center;gap:10px;text-decoration:none;color:#0a2a7a;font:800 1.1rem 'Baloo 2',sans-serif;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);padding:6px 16px 6px 8px;border-radius:99px;box-shadow:0 8px 20px rgba(20,70,170,.18)}
.back img{height:38px;border-radius:10px}
.top h1{margin:0;font:800 clamp(1.8rem,4.5vw,3rem) 'Baloo 2',sans-serif;text-shadow:0 3px 0 rgba(255,255,255,.7)}
main{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:26px 20px 50px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px}
.m{display:flex;align-items:center;gap:20px;text-decoration:none;color:#0a2a7a;background:linear-gradient(160deg,#fff,#eef5ff);border-radius:34px;padding:24px 26px;min-height:170px;box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 45%,transparent),0 22px 44px rgba(3,20,90,.28);transition:transform .25s cubic-bezier(.3,1.5,.5,1),box-shadow .25s}
.m:hover,.m:focus-visible{transform:translateY(-6px) scale(1.02);box-shadow:0 0 0 9px color-mix(in srgb,var(--c) 60%,transparent),0 28px 54px rgba(3,20,90,.36);outline:none}
.ic{flex:none;width:88px;height:88px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 16%,#fff);box-shadow:inset 0 -6px 12px color-mix(in srgb,var(--c) 25%,transparent)}
.ic svg{width:46px;height:46px;stroke:var(--c);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.m b{display:block;font:800 clamp(1.25rem,2.6vw,1.7rem)/1.1 'Baloo 2',sans-serif;color:var(--c)}
.m span{display:block;margin-top:6px;font-weight:700;font-size:.95rem;color:#3d4f86;line-height:1.4}
.no{position:absolute;margin:-12px 0 0 -8px;background:var(--c);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font:800 1rem 'Baloo 2',sans-serif;box-shadow:0 6px 14px rgba(0,0,0,.25)}
@media (max-width:720px){.grid{grid-template-columns:1fr}.m{min-height:130px;padding:18px}.ic{width:70px;height:70px}.ic svg{width:36px;height:36px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<i class="bub b1"></i><i class="bub b2"></i><i class="bub b3"></i><i class="bub b4"></i>
<div class="top"><a class="back" href="index.html"><img src="logo-teman-teguh.jpg" alt="Teman Teguh"><span>Teman Teguh</span></a><h1>PELATIHAN</h1></div>
<main>
  <nav class="grid" aria-label="Sub menu Pelatihan">
    <a class="m" href="alumni.html" style="--c:#ff5d6c"><i class="no">1</i>
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M12 21s-7-5.6-7-11a7 7 0 0 1 14 0c0 5.4-7 11-7 11z"/><circle cx="12" cy="10" r="2.6"/></svg></div>
      <div><b>ALUMNI PELATIHAN</b><span>Peta dan data alumni pelatihan di seluruh Indonesia</span></div></a>
    <a class="m" href="pembelajaran.html" style="--c:#18c08a"><i class="no">2</i>
      <div class="ic"><svg viewBox="0 0 24 24"><path d="M2 5.5A1.5 1.5 0 0 1 3.5 4H9a3 3 0 0 1 3 3v13a2 2 0 0 0-2-2H3.5A1.5 1.5 0 0 1 2 16.5z"/><path d="M22 5.5A1.5 1.5 0 0 0 20.5 4H15a3 3 0 0 0-3 3v13a2 2 0 0 1 2-2h6.5a1.5 1.5 0 0 0 1.5-1.5z"/></svg></div>
      <div><b>PEMBELAJARAN</b><span>Lihat tugas, unggah tugas, reviu tugas, dan lihat nilai</span></div></a>
    <a class="m" href="pustaka.html?ruang=Coaching" style="--c:#ffb020"><i class="no">3</i>
      <div class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></div>
      <div><b>COACHING</b><span>SK Coaching, Proses Coaching, dan Produk Coaching</span></div></a>
    <a class="m" href="pustaka.html?ruang=Mentoring" style="--c:#8b5cf6"><i class="no">4</i>
      <div class="ic"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3 20a6 6 0 0 1 12 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 5 4.8"/></svg></div>
      <div><b>MENTORING</b><span>SK Mentoring, Output Mentoring, dan Gallery TCM</span></div></a>
  </nav>
</main>
</body>
</html>
