<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Teman Teguh - Profil</title>
<link rel="icon" type="image/png" href="favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito',system-ui,sans-serif;color:#0a2a7a;min-height:100vh;background:radial-gradient(900px 600px at 85% 10%,#e9f8ff,transparent 60%),linear-gradient(160deg,#a9e4ff,#6cc6ff 55%,#4aa8ff);background-attachment:fixed}
.bub{position:fixed;z-index:0;border-radius:50%;pointer-events:none;background:radial-gradient(circle at 32% 26%,#fffbe3 0,#ffe98a 13%,#ffc928 40%,#e29c00 72%,#9c6300 100%);box-shadow:inset -8px -12px 22px rgba(120,70,0,.5),inset 6px 8px 14px rgba(255,255,255,.6),0 18px 28px rgba(20,70,160,.25);animation:fl var(--d,12s) ease-in-out infinite alternate}
.b1{width:120px;height:120px;left:-35px;top:38%;--d:13s}.b2{width:70px;height:70px;right:3%;top:12%;--d:9s}.b3{width:160px;height:160px;right:-55px;bottom:8%;--d:15s}
@keyframes fl{to{transform:translateY(-40px)}}
.top{position:relative;z-index:2;max-width:1100px;margin:0 auto;padding:16px 20px 0;display:flex;justify-content:space-between;align-items:center;gap:12px}
.back{display:flex;align-items:center;gap:10px;text-decoration:none;color:#0a2a7a;font:800 1.1rem 'Baloo 2',sans-serif;background:rgba(255,255,255,.75);backdrop-filter:blur(8px);padding:6px 16px 6px 8px;border-radius:99px;box-shadow:0 8px 20px rgba(20,70,170,.18)}
.back img{height:46px;width:auto;border-radius:0;filter:drop-shadow(0 4px 8px rgba(90,40,170,.4));transition:transform .35s cubic-bezier(.3,1.6,.5,1)}
.back:hover img,.back:focus-visible img{transform:rotate(-7deg) scale(1.12)}
.top h1{margin:0;font:800 clamp(1.6rem,4vw,2.6rem) 'Baloo 2',sans-serif;text-shadow:0 3px 0 rgba(255,255,255,.7)}
main{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:16px 20px 40px}
.hero{display:grid;grid-template-columns:260px 1fr;gap:26px;align-items:center;padding:26px;border-radius:30px;color:#fff;background:radial-gradient(300px 200px at 0 0,rgba(255,214,90,.35),transparent 70%),linear-gradient(135deg,#0f43dc,#0a2a8f 60%,#071d6b);box-shadow:0 26px 50px rgba(8,40,150,.42),inset 0 0 0 1.5px rgba(255,214,90,.55);position:relative;overflow:hidden}
.ft{width:240px;height:240px;border-radius:50%;padding:7px;margin:auto;background:conic-gradient(#fff0a8,#f2a900,#fff0a8,#f2a900,#fff0a8);box-shadow:0 14px 30px rgba(0,0,40,.45)}
.ft div{width:100%;height:100%;border-radius:50%;overflow:hidden;background:linear-gradient(145deg,#3b86ff,#0a2a8f);display:grid;place-items:center;font:800 4.5rem 'Baloo 2',sans-serif;color:#ffd24a}
.ft img{width:100%;height:100%;object-fit:cover;display:block}
.hero h2{margin:0;font:800 clamp(1.5rem,3.4vw,2.3rem)/1.15 'Baloo 2',sans-serif}
.hero .jb{margin:6px 0 0;font-weight:800;color:#ffe9a8;font-size:1.05rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:linear-gradient(135deg,#fff0a8,#ffc928);color:#5a3500;border-radius:99px;padding:5px 14px;font-weight:800;font-size:.88rem;box-shadow:0 6px 14px rgba(0,0,40,.25)}
.sor{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:18px 0}
.so{background:#fff;border-radius:20px;padding:14px 18px;box-shadow:0 12px 28px rgba(20,70,170,.18);border-top:6px solid var(--c)}
.so b{display:block;font:800 1.45rem/1.15 'Baloo 2',sans-serif;color:var(--c)}.so span{font-weight:800;font-size:.9rem;color:#3d4f86}
.grid{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:start}
.card{background:#fff;border-radius:26px;padding:22px 24px;box-shadow:0 16px 36px rgba(20,70,170,.2);margin-bottom:18px}
.card h3{margin:0 0 12px;font:800 1.45rem 'Baloo 2',sans-serif;display:flex;align-items:center;gap:10px}
.card h3::before{content:"";width:8px;height:26px;border-radius:99px;background:linear-gradient(#ffc928,#f2a900)}
.card p{margin:0 0 10px;line-height:1.65;font-weight:600;color:#26407f}
.it{padding:10px 0;border-bottom:1px dashed #d6e4ff}.it:last-child{border:0}
.it b{display:block;font:800 1.05rem 'Baloo 2',sans-serif}.it span{font-size:.9rem;font-weight:700;color:#4a5d92}
.tl{position:relative;padding-left:22px}.tl::before{content:"";position:absolute;left:6px;top:6px;bottom:6px;width:3px;border-radius:3px;background:linear-gradient(#ffc928,#3b82f6)}
.ti{position:relative;margin-bottom:14px}.ti::before{content:"";position:absolute;left:-23px;top:5px;width:13px;height:13px;border-radius:50%;background:#ffc928;border:3px solid #fff;box-shadow:0 2px 6px rgba(10,42,122,.35)}
.ti em{font-style:normal;font-weight:800;color:#a65f00;font-size:.85rem}
.ti b{display:block;font:800 1rem/1.3 'Baloo 2',sans-serif}
.tg{display:inline-block;background:#eaf3ff;color:#2c5ad8;border-radius:99px;padding:1px 10px;font-size:.74rem;font-weight:800;margin-top:2px}
.kw{display:flex;flex-wrap:wrap;gap:8px}.kw span{background:#eaf3ff;color:#0a2a7a;border-radius:12px;padding:6px 12px;font-weight:800;font-size:.86rem}
ul.sm{margin:0;padding-left:20px;font-weight:700;color:#26407f;line-height:1.7;font-size:.93rem}
a.btn{display:inline-block;margin:0 8px 8px 0;text-decoration:none;color:#fff;font-weight:800;padding:10px 18px;border-radius:14px;background:linear-gradient(135deg,#ff5d6c,#ff8a3d);box-shadow:0 8px 18px rgba(255,93,108,.35)}
.src a{color:#2c5ad8;font-weight:700;font-size:.88rem}.src li{margin-bottom:4px}
.note{font-size:.78rem;font-weight:700;color:#24407f;opacity:.85;margin-top:6px}
@media (max-width:900px){.hero{grid-template-columns:1fr;text-align:center}.hero .chips{justify-content:center}.grid{grid-template-columns:1fr}.ft{width:200px;height:200px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<i class="bub b1"></i><i class="bub b2"></i><i class="bub b3"></i>
<div class="top"><a class="back" href="index.html"><img src="logo-emblem.png" alt="Logo Teman Teguh"><span>Teman Teguh</span></a><h1>PROFIL</h1></div>
<main>
  <section class="hero">
    <div class="ft"><div id="ft"></div></div>
    <div><h2 id="nm"></h2><p class="jb" id="jb"></p><div class="chips" id="pr"></div></div>
  </section>
  <section class="sor" id="sor"></section>
  <div class="grid">
    <div>
      <section class="card"><h3>Tentang</h3><div id="rg"></div></section>
      <section class="card"><h3>Pengalaman dan Kegiatan</h3><div class="tl" id="tl"></div></section>
      <section class="card"><h3>Kegiatan Ilmiah dan Seminar</h3><ul class="sm" id="sm"></ul></section>
    </div>
    <div>
      <section class="card"><h3>Pendidikan</h3><div id="pd"></div></section>
      <section class="card"><h3>Mengampu</h3><div id="mg"></div></section>
      <section class="card"><h3>Bidang Keahlian</h3><div class="kw" id="kh"></div></section>
      <section class="card"><h3>Karya Tulis</h3><div id="kr"></div></section>
      <section class="card"><h3>Tautan</h3><div id="tt"></div></section>
      <section class="card src"><h3>Sumber</h3><ul class="sm" id="sb"></ul></section>
    </div>
  </div>
</main>
<script src="profil-data.js"></script>
<script>
var P = window.PROFIL || {};
var $ = function (id) { return document.getElementById(id); };
function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
function isi(id, arr, fn) { var w = $(id); (arr || []).forEach(function (x, i) { w.appendChild(fn(x, i)); }); }
function item(x) { var d = el('div', 'it'); d.appendChild(el('b', '', x.judul)); d.appendChild(el('span', '', x.ket)); return d; }
function tautan(x, cls) { var a = el('a', cls, x.teks); a.href = x.url; a.target = '_blank'; a.rel = 'noopener noreferrer'; return a; }

$('nm').textContent = P.nama || '';
$('jb').textContent = (P.jabatan || '') + ' - ' + (P.instansi || '');
document.title = 'Teman Teguh - Profil ' + (P.nama || '');
isi('pr', P.peran, function (x) { return el('span', 'chip', x); });

var fotoBox = $('ft'), ini = (P.nama || 'TT').split(/\s+/).filter(function (w) { return /^[A-Z]/.test(w); }).slice(0, 2).map(function (w) { return w[0]; }).join('');
fotoBox.textContent = ini;
if (P.foto) { var img = new Image(); img.alt = 'Foto ' + (P.nama || ''); img.onload = function () { fotoBox.textContent = ''; fotoBox.appendChild(img); }; img.src = P.foto; }

var warna = ['#ff5d6c', '#ffb020', '#18c08a', '#8b5cf6'];
isi('sor', P.sorotan, function (x, i) { var d = el('div', 'so'); d.style.setProperty('--c', warna[i % 4]); d.appendChild(el('b', '', x.angka)); d.appendChild(el('span', '', x.label)); return d; });
isi('rg', P.ringkasan, function (x) { return el('p', '', x); });
isi('tl', P.linimasa, function (x) { var d = el('div', 'ti'); d.appendChild(el('em', '', x.tahun)); d.appendChild(el('b', '', x.judul)); d.appendChild(el('span', 'tg', x.jenis)); return d; });
isi('sm', P.seminar, function (x) { return el('li', '', x); });
isi('pd', P.pendidikan, item); isi('mg', P.mengajar, item); isi('kr', P.karya, item);
isi('kh', P.keahlian, function (x) { return el('span', '', x); });
isi('tt', P.tautan, function (x) { return tautan(x, 'btn'); });
isi('sb', P.sumber, function (x) { var li = el('li'); li.appendChild(tautan(x)); return li; });
</script>
</body>
</html>
